name: Home Girl Preview — GitHub Pages

on:
  push:
    branches:
      - feature/calendar-tasks-reminders
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: homegirl-pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Home Girl static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publish preview through GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
